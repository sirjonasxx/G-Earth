name: Build G-Earth

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/**'
      - 'deps/**'
      - 'G-Earth/**'
      - 'G-Earth-Api/**'
      - 'pom.xml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'deps/**'
      - 'G-Earth/**'
      - 'G-Earth-Api/**'
      - 'pom.xml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            jdk-package: 'jdk+fx'
            jdk-arch: 'x86'
            jdk-distribution: 'liberica'
          - os: windows-latest
            jdk-package: 'jdk+fx'
            jdk-arch: 'x64'
            jdk-distribution: 'liberica'
          - os: macos-15-intel
            jdk-package: 'jdk+fx'
            jdk-arch: 'x64'
            jdk-distribution: 'liberica'
          - os: macos-latest
            jdk-package: 'jdk+fx'
            jdk-arch: 'aarch64'
            jdk-distribution: 'liberica'
          - os: ubuntu-latest
            jdk-package: 'jdk+fx'
            jdk-arch: 'x64'
            jdk-distribution: 'liberica'
          - os: ubuntu-24.04-arm
            jdk-package: 'jdk+fx'
            jdk-arch: 'aarch64'
            jdk-distribution: 'liberica'

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    name: Build ${{ matrix.os }} (${{ matrix.jdk-arch }})
    steps:
    - name: Set OS variable
      id: osmap
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == windows-* ]]; then
          echo "TARGET_OS=windows" >> "$GITHUB_ENV"
        elif [[ "${{ matrix.os }}" == ubuntu-* ]]; then
          echo "TARGET_OS=linux" >> "$GITHUB_ENV"
        elif [[ "${{ matrix.os }}" == macos-* ]]; then
          echo "TARGET_OS=mac" >> "$GITHUB_ENV"
        fi

    - name: Checkout G-Earth
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        java-package: ${{ matrix.jdk-package }}
        architecture: ${{ matrix.jdk-arch }}
        distribution: ${{ matrix.jdk-distribution }}
        cache: 'maven'
        cache-dependency-path: 'G-Earth/pom.xml'

    - name: Install JavaPackager
      working-directory: deps/JavaPackager
      run: ./gradlew publishToMavenLocal

    # Check if GITHUB_REF_TYPE is a tag
    - name: Build G-Earth
      shell: bash
      env:
        MATRIX_OS: ${{ matrix.os }}
        MATRIX_JDK_ARCH: ${{ matrix.jdk-arch }}
      run: |
        MVN_PROFILE=""
        
        if [[ $GITHUB_REF_TYPE == 'tag' ]]; then
          mvn -B package $MVN_PROFILE \
            -Drepository=${GITHUB_REPOSITORY} \
            -Dmaven.compiler.source=21 \
            -Dmaven.compiler.target=21 \
            -Dos=${TARGET_OS} \
            -Dchangelist=
        else
          mvn -B package $MVN_PROFILE \
            -Drepository=${GITHUB_REPOSITORY} \
            -Dmaven.compiler.source=21 \
            -Dmaven.compiler.target=21 \
            -Dos=${TARGET_OS}
        fi

    - name: Verify universal macOS G-MemZ
      if: env.TARGET_OS == 'mac'
      shell: bash
      run: |
        APP="G-Earth/target/G-Earth/G-Earth.app"
        RESOURCES="$APP/Contents/Resources"

        lipo "$RESOURCES/G-MemZ" -verify_arch arm64 x86_64
        codesign --verify --strict "$RESOURCES/G-MemZ"
        codesign -d --entitlements :- "$RESOURCES/G-MemZ" 2>&1 \
          | grep -q 'com.apple.security.cs.debugger'
        "$RESOURCES/G-MemZ" --self-test

        test -x "$RESOURCES/Install-Extension-Java.command"
        test -x "$RESOURCES/Prepare-Habbo-for-G-Mem.command"
        test -x "G-Earth/target/G-Earth/G-Earth.command"
        codesign --verify --deep --strict "$APP"

    - name: Upload platform artifact
      uses: actions/upload-artifact@v4
      with:
        name: G-Earth ${{ env.TARGET_OS }}-${{ matrix.jdk-arch }}
        path: G-Earth/target/G-Earth
        if-no-files-found: error
        retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download platform artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts

    - name: Create release archives
      shell: bash
      run: |
        mkdir -p release

        for directory in artifacts/*; do
          [[ -d "$directory" ]] || continue

          artifact_name="$(basename "$directory")"
          artifact_name="${artifact_name// /-}"

          (
            cd "$directory"
            zip -qry "../../release/${artifact_name}-${GITHUB_REF_NAME}.zip" .
          )
        done

        archive_count="$(find release -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')"
        if [[ "$archive_count" -ne 6 ]]; then
          echo "Expected 6 release archives, found $archive_count" >&2
          find release -maxdepth 1 -type f -print
          exit 1
        fi

        ls -lh release

    - name: Create or update GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
        else
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --verify-tag \
            --generate-notes \
            --title "G-Earth $GITHUB_REF_NAME"
        fi
