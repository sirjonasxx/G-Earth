name: Build G-Earth

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Reuse artifacts from this tag build run and skip rebuilding (leave blank for a normal build)'
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/**'
      - 'deps/**'
      - 'G-Earth/**'
      - 'G-Earth-Api/**'
      - 'pom.xml'

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            jdk-package: 'jdk+fx'
            jdk-arch: 'x86'
            jdk-distribution: 'liberica'
          - os: windows-latest
            jdk-package: 'jdk+fx'
            jdk-arch: 'x64'
            jdk-distribution: 'liberica'
          - os: macos-latest
            jdk-package: 'jdk+fx'
            jdk-arch: 'x64'
            jdk-distribution: 'liberica'
          - os: macos-latest
            jdk-package: 'jdk+fx'
            jdk-arch: 'aarch64'
            jdk-distribution: 'liberica'
          - os: ubuntu-latest
            jdk-package: 'jdk+fx'
            jdk-arch: 'x64'
            jdk-distribution: 'liberica'

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    name: Build ${{ matrix.os }} (${{ matrix.jdk-arch }})
    steps:
    - name: Set OS variable
      id: osmap
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          echo "TARGET_OS=windows" >> $GITHUB_ENV
        elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          echo "TARGET_OS=linux" >> $GITHUB_ENV
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          echo "TARGET_OS=mac" >> $GITHUB_ENV
        fi

    - name: Checkout G-Earth
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        java-package: ${{ matrix.jdk-package }}
        architecture: ${{ matrix.jdk-arch }}
        distribution: ${{ matrix.jdk-distribution }}
        cache: 'maven'

    # Check if GITHUB_REF_TYPE is a tag
    - name: Build G-Earth
      shell: bash
      env:
        MATRIX_OS: ${{ matrix.os }}
        MATRIX_JDK_ARCH: ${{ matrix.jdk-arch }}
      run: |
        MVN_PROFILE=""
        
        if [[ $GITHUB_REF_TYPE == 'tag' ]]; then
          mvn -B package $MVN_PROFILE \
            -Drepository=${GITHUB_REPOSITORY} \
            -Dmaven.compiler.source=21 \
            -Dmaven.compiler.target=21 \
            -Dos=${TARGET_OS} \
            -Dchangelist=
        else
          mvn -B package $MVN_PROFILE \
            -Drepository=${GITHUB_REPOSITORY} \
            -Dmaven.compiler.source=21 \
            -Dmaven.compiler.target=21 \
            -Dos=${TARGET_OS}
        fi

    - name: Package platform artifact
      shell: bash
      env:
        MATRIX_JDK_ARCH: ${{ matrix.jdk-arch }}
      run: |
        mkdir -p release
        ASSET_NAME="G-Earth-${TARGET_OS}-${MATRIX_JDK_ARCH}"

        if [[ "${TARGET_OS}" == "windows" ]]; then
          7z a -tzip "release/${ASSET_NAME}.zip" "./G-Earth/target/G-Earth/*"
        elif [[ "${TARGET_OS}" == "mac" ]]; then
          ditto -c -k --sequesterRsrc --keepParent \
            "G-Earth/target/G-Earth/G-Earth.app" \
            "release/${ASSET_NAME}.zip"
        else
          tar -C G-Earth/target -czf "${GITHUB_WORKSPACE}/release/${ASSET_NAME}.tar.gz" G-Earth
        fi

    - name: Upload platform artifact
      uses: actions/upload-artifact@v7
      with:
        name: G-Earth-${{ env.TARGET_OS }}-${{ matrix.jdk-arch }}
        path: release/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 30

  release:
    if: >-
      always() && !cancelled() &&
      ((needs.build.result == 'success' && github.ref_type == 'tag') ||
       (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != ''))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: Resolve release tag
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      run: |
        RELEASE_TAG="${GITHUB_REF_NAME}"

        if [[ -n "${ARTIFACT_RUN_ID}" ]]; then
          [[ "${ARTIFACT_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "Artifact run ID must be numeric" >&2; exit 1; }
          SOURCE_RUN=$(gh api "repos/${GH_REPO}/actions/runs/${ARTIFACT_RUN_ID}")
          SOURCE_WORKFLOW=$(jq -r .path <<< "${SOURCE_RUN}")
          SOURCE_STATUS=$(jq -r .status <<< "${SOURCE_RUN}")
          RELEASE_TAG=$(jq -r .head_branch <<< "${SOURCE_RUN}")
          SOURCE_SHA=$(jq -r .head_sha <<< "${SOURCE_RUN}")

          [[ "${SOURCE_WORKFLOW}" == '.github/workflows/build.yml' && "${SOURCE_STATUS}" == 'completed' ]] || {
            echo "Source must be a completed Build G-Earth workflow run" >&2
            exit 1
          }
          TAG_REF=$(jq -rn --arg tag "${RELEASE_TAG}" '$tag | @uri')
          gh api "repos/${GH_REPO}/git/ref/tags/${TAG_REF}" > /dev/null
          TAG_SHA=$(gh api "repos/${GH_REPO}/commits/${TAG_REF}" --jq .sha)
          [[ "${SOURCE_SHA}" == "${TAG_SHA}" ]] || { echo "Source run commit does not match the tag" >&2; exit 1; }
        fi

        echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

    - name: Download platform artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: G-Earth-*
        path: release
        merge-multiple: true
        github-token: ${{ github.token }}
        run-id: ${{ inputs.artifact_run_id || github.run_id }}

    - name: Attest release assets
      uses: actions/attest@v4
      with:
        subject-path: release/*

    - name: Create draft release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        RELEASE_IS_DRAFT=$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)

        if [[ "${RELEASE_IS_DRAFT}" == "true" ]]; then
          gh release upload "${RELEASE_TAG}" release/* --clobber
        elif [[ "${RELEASE_IS_DRAFT}" == "false" ]]; then
          echo "A published release already exists for ${RELEASE_TAG}" >&2
          exit 1
        else
          gh release create "${RELEASE_TAG}" release/* \
            --draft \
            --generate-notes \
            --title "${RELEASE_TAG}" \
            --verify-tag
        fi
